<!DOCTYPE html>
<html>
<head>
  <title>Researcher Profile</title>
</head>
<body>

<h1>Researcher Profile</h1>

<h2 id="researcherName"></h2>

<h3>Publications</h3>
<ul id="publicationList"></ul>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  "https://mueazsxhdwvlnzzmrjqk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11ZWF6c3hoZHd2bG56em1yanFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NjQxNDMsImV4cCI6MjA4NzI0MDE0M30.Ad_ktM-_wNcDQg0aHRgCVGDcXFsEha-9uJ9j-0IrfmU"
);

const params = new URLSearchParams(window.location.search);
const researcherId = params.get("id");

async function loadProfile() {

  const { data: researcher } = await supabase
    .from("researchers")
    .select("*")
    .eq("id", researcherId)
    .single();

  if (researcher) {
  document.getElementById("researcherName").innerText = researcher.name;
}


  const { data: publications } = await supabase
    .from("publications")
    .select("*")
    .eq("researcher_id", researcherId);

  const list = document.getElementById("publicationList");
  list.innerHTML = "";

  publications.forEach(p => {
    const li = document.createElement("li");
    li.textContent = p.title + " (" + p.year + ") - Citations: " + (p.citations || 0);

    list.appendChild(li);
  });
}

loadProfile();

</script>

</body>
</html>
