<!DOCTYPE html>
<html>
<head>
    <title>University Research Ranking</title>
</head>
<body>

<h1>University Researcher Ranking Platform</h1>
<a href="leaderboard.html">View Researcher Leaderboard</a>

<h2>Add Test Researcher</h2>
<h2>Add Publication</h2>
<input id="fetchName" placeholder="Researcher Name for Auto Fetch">
<button id="fetchBtn">Auto Fetch Publications</button>

<p id="fetchStatus"></p>

<select id="researcherSelect"></select>
<input id="pubTitle" placeholder="Publication Title">
<input id="pubYear" placeholder="Year">
<button id="addPubBtn">Add Publication</button>

<p id="pubStatus"></p>

<input id="name" placeholder="Researcher Name">
<button id="addBtn">Add Researcher</button>

<p id="status"></p>

<h2>All Researchers</h2>
<ul id="researcherList"></ul>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  "https://mueazsxhdwvlnzzmrjqk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11ZWF6c3hoZHd2bG56em1yanFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NjQxNDMsImV4cCI6MjA4NzI0MDE0M30.Ad_ktM-_wNcDQg0aHRgCVGDcXFsEha-9uJ9j-0IrfmU"
);

const button = document.getElementById("addBtn");

button.addEventListener("click", async () => {

  const name = document.getElementById("name").value;

  const { data, error } = await supabase
    .from("researchers")
    .insert([{ name: name }]);

  if (error) {
    document.getElementById("status").innerText = error.message;
  } else {
    document.getElementById("status").innerText = "Researcher added!";
    loadResearchers();
  }

});

async function loadResearchers() {

  const { data, error } = await supabase
    .from("researchers")
    .select("*");

  const list = document.getElementById("researcherList");
  list.innerHTML = "";

  if(data){
    data.forEach(r => {
      const li = document.createElement("li");
const link = document.createElement("a");
link.href = "profile.html?id=" + r.id;
link.textContent = r.name + " (Score: " + (r.score || 0) + ")";

li.appendChild(link);
      list.appendChild(li);
    });
  }
}
async function loadResearchersDropdown() {

  const { data } = await supabase
    .from("researchers")
    .select("*");

  const select = document.getElementById("researcherSelect");
  select.innerHTML = "";

  if(data){
    data.forEach(r => {
      const option = document.createElement("option");
      option.value = r.id;
      option.textContent = r.name;
      select.appendChild(option);
    });
  }
}
const pubButton = document.getElementById("addPubBtn");

pubButton.addEventListener("click", async () => {

  const researcherId = document.getElementById("researcherSelect").value;
  const title = document.getElementById("pubTitle").value;
  const year = document.getElementById("pubYear").value;

  const { error } = await supabase
    .from("publications")
    .insert([{
      researcher_id: researcherId,
      title: title,
      year: parseInt(year)
    }]);

 if(error){
  document.getElementById("pubStatus").innerText = error.message;
} else {
  document.getElementById("pubStatus").innerText = "Publication added!";
  updateScores();
  loadResearchers();
}

});
async function updateScores() {

  const { data: researchers } = await supabase
    .from("researchers")
    .select("*");

  for (const r of researchers) {

    const { data: pubs } = await supabase
      .from("publications")
      .select("*")
      .eq("researcher_id", r.id);

    const score = pubs.length * 10;

    await supabase
      .from("researchers")
      .update({ score: score })
      .eq("id", r.id);

  }

}
const fetchButton = document.getElementById("fetchBtn");

fetchButton.addEventListener("click", async () => {

  const name = document.getElementById("fetchName").value;

  document.getElementById("fetchStatus").innerText = "Fetching publications...";

  const response = await fetch(
    "https://api.crossref.org/works?query.author=" + encodeURIComponent(name)
  );

  const result = await response.json();

  const items = result.message.items.slice(0,5);

  for (const paper of items) {

    const title = paper.title ? paper.title[0] : "Unknown Title";

    const year = paper.created
      ? paper.created["date-parts"][0][0]
      : 2024;

    const { data: researcher } = await supabase
      .from("researchers")
      .select("*")
      .eq("name", name)
      .single();

    if(researcher){

      await supabase
        .from("publications")
        .insert([{
          researcher_id: researcher.id,
          title: title,
          year: year
        }]);

    }

  }

  await updateScores();
  await loadResearchers();

  document.getElementById("fetchStatus").innerText = "Publications imported!";

});

loadResearchers();
loadResearchersDropdown();

</script>

</body>
</html>
