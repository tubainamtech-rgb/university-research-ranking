<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
</head>
<body>

<div id="loginSection">
  <h1>Admin Login</h1>
  <input id="passwordInput" type="password" placeholder="Enter admin password">
  <button id="loginBtn">Login</button>
  <p id="loginError" style="color:red;"></p>
</div>

<div id="adminSection" style="display:none;">
  <h1>Admin Panel</h1>
  <a href="index.html">← Back to Home</a>

  <h2>⏳ Pending Approval</h2>
  <p>These researchers have registered but their score is not yet public.</p>
  <ul id="pendingList"></ul>

  <h2>✅ Approved Researchers</h2>
  <ul id="approvedList"></ul>
</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  "https://mueazsxhdwvlnzzmrjqk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11ZWF6c3hoZHd2bG56em1yanFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NjQxNDMsImV4cCI6MjA4NzI0MDE0M30.Ad_ktM-_wNcDQg0aHRgCVGDcXFsEha-9uJ9j-0IrfmU"
);

// ⚠️ Change this to your own secret password
const ADMIN_PASSWORD = "T2026obainam";

// Login check
document.getElementById("loginBtn").addEventListener("click", () => {
  const entered = document.getElementById("passwordInput").value;
  if (entered === ADMIN_PASSWORD) {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("adminSection").style.display = "block";
    loadResearchers();
  } else {
    document.getElementById("loginError").innerText = "Incorrect password.";
  }
});

async function loadResearchers() {

  // Load ALL researchers from Supabase
  const { data, error } = await supabase
    .from("researchers")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  const pendingList = document.getElementById("pendingList");
  const approvedList = document.getElementById("approvedList");
  pendingList.innerHTML = "";
  approvedList.innerHTML = "";

  data.forEach(r => {

    const li = document.createElement("li");
    li.style.marginBottom = "10px";

    // Researcher info
    const info = document.createElement("span");
    info.textContent = r.name
      + (r.discipline ? " | " + r.discipline : "")
      + (r.affiliation ? " | " + r.affiliation : "")
      + " | Score: " + (r.score || 0) + "   ";
    li.appendChild(info);

    // Profile link
    const profileLink = document.createElement("a");
    profileLink.href = "profile.html?id=" + r.id;
    profileLink.textContent = "[View Profile]";
    profileLink.target = "_blank";
    profileLink.style.marginRight = "10px";
    li.appendChild(profileLink);

    if (!r.score_approved) {
      // Approve button
      const approveBtn = document.createElement("button");
      approveBtn.textContent = "Approve Score";
      approveBtn.addEventListener("click", async () => {
        await supabase
          .from("researchers")
          .update({ score_approved: true })
          .eq("id", r.id);
        loadResearchers();
      });
      li.appendChild(approveBtn);
      pendingList.appendChild(li);

    } else {
      // Revoke button
      const revokeBtn = document.createElement("button");
      revokeBtn.textContent = "Revoke Approval";
      revokeBtn.addEventListener("click", async () => {
        await supabase
          .from("researchers")
          .update({ score_approved: false })
          .eq("id", r.id);
        loadResearchers();
      });
      li.appendChild(revokeBtn);
      approvedList.appendChild(li);
    }

  });
}

</script>
</body>
</html>
